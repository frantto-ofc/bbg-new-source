name: Fix leadership reveal runtime
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix-reveal:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject names before reveal initialization
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '// BBG leadership names before reveal'
          if marker not in s:
              needle = "  if (!root || !root.classList.contains('bbg-elementor')) return;\n"
              inject = needle + "\n  // BBG leadership names before reveal\n  const secondName = root.querySelector('#fernando-title-2');\n  const thirdName = root.querySelector('#fernando-title-3');\n  if (secondName) secondName.textContent = 'Diogo';\n  if (thirdName) thirdName.textContent = 'Carlos';\n"
              if needle not in s:
                  raise SystemExit('Main reveal initializer not found')
              s = s.replace(needle, inject, 1)
              p.write_text(s, encoding='utf-8')
      - name: Commit runtime reveal fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Make Diogo and Carlos use scroll reveal"
          git push