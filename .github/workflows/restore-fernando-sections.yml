name: Restore Fernando sections

on:
  push:
    paths:
      - '.github/workflows/restore-fernando-sections.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore alternating Fernando sections
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          if 'id="fernando-2"' in html or 'id="fernando-3"' in html:
              print('Additional Fernando sections already exist; nothing to do.')
              raise SystemExit(0)

          start = html.find('<section class="fernando-section" id="fernando"')
          if start == -1:
              raise SystemExit('Fernando section not found')

          end = html.find('</section>', start)
          if end == -1:
              raise SystemExit('Fernando section closing tag not found')
          end += len('</section>')

          original = html[start:end]

          second = original.replace('id="fernando"', 'id="fernando-2"', 1)
          second = second.replace('aria-labelledby="fernando-title"', 'aria-labelledby="fernando-title-2"', 1)
          second = second.replace('id="fernando-title"', 'id="fernando-title-2"', 1)
          second = second.replace('class="fernando-section"', 'class="fernando-section fernando-section-alt"', 1)

          third = original.replace('id="fernando"', 'id="fernando-3"', 1)
          third = third.replace('aria-labelledby="fernando-title"', 'aria-labelledby="fernando-title-3"', 1)
          third = third.replace('id="fernando-title"', 'id="fernando-title-3"', 1)
          third = third.replace('class="fernando-section"', 'class="fernando-section fernando-section-third"', 1)

          html = html[:start] + original + '\n' + second + '\n' + third + html[end:]

          css = '''
/* Fernando — sequência de 3 seções alternadas */
.bbg-elementor .fernando-section + .fernando-section{padding-top:0;}
.bbg-elementor .fernando-section-alt{color:#111;background:#fff;}
.bbg-elementor .fernando-section-alt .fernando-shell{background:#f0eee8;color:#111;grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);}
.bbg-elementor .fernando-section-alt .fernando-portrait{grid-column:2;grid-row:1;}
.bbg-elementor .fernando-section-alt .fernando-content{grid-column:1;grid-row:1;}
.bbg-elementor .fernando-section-alt .fernando-content .prime-label{color:#777;}
.bbg-elementor .fernando-section-alt .fernando-content h2{color:#111;}
.bbg-elementor .fernando-section-alt .fernando-role{color:#AE9C6E;}
.bbg-elementor .fernando-section-alt .fernando-summary p{color:#555;}
.bbg-elementor .fernando-section-alt .fernando-milestones{border-top-color:#1113;}
.bbg-elementor .fernando-section-alt .fernando-milestones>div{border-right-color:#1113;}
.bbg-elementor .fernando-section-alt .fernando-milestones dt{color:#111;}
.bbg-elementor .fernando-section-alt .fernando-milestones dd{color:#666;}
.bbg-elementor .fernando-section-alt .fernando-link{color:#111;border-bottom-color:#1118;}
.bbg-elementor .fernando-section-third{background:#fff;}
@media(max-width:1000px){
  .bbg-elementor .fernando-section-alt .fernando-shell{grid-template-columns:1fr;}
  .bbg-elementor .fernando-section-alt .fernando-portrait{grid-column:1;grid-row:1;}
  .bbg-elementor .fernando-section-alt .fernando-content{grid-column:1;grid-row:2;}
}
'''

          marker = '</style>\n<div class="bbg-elementor">'
          if marker not in html:
              raise SystemExit('Main style marker not found')
          html = html.replace(marker, css + '\n</style>\n<div class="bbg-elementor">', 1)

          path.write_text(html, encoding='utf-8')
          PY

      - name: Commit restored sections
        run: |
          if git diff --quiet -- index.html; then
            echo "No index changes"
            exit 0
          fi
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add index.html
          git commit -m "Restore three Fernando sections with alternating colors"
          git push
