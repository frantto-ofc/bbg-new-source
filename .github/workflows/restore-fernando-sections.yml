name: Restore Fernando sections
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  restore:
    if: github.event.head_commit.message != 'Restore three Fernando sections with alternating colors'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Restore alternating Fernando sections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'id="fernando-2"' in s:
              print('Fernando sections already restored')
              raise SystemExit(0)
          a = s.find('<section class="fernando-section" id="fernando"')
          if a < 0:
              raise SystemExit('Fernando section not found')
          b = s.find('</section>', a)
          if b < 0:
              raise SystemExit('Fernando section end not found')
          b += len('</section>')
          one = s[a:b]
          two = one.replace('id="fernando"','id="fernando-2"',1).replace('aria-labelledby="fernando-title"','aria-labelledby="fernando-title-2"',1).replace('id="fernando-title"','id="fernando-title-2"',1).replace('class="fernando-section"','class="fernando-section fernando-section-alt"',1)
          three = one.replace('id="fernando"','id="fernando-3"',1).replace('aria-labelledby="fernando-title"','aria-labelledby="fernando-title-3"',1).replace('id="fernando-title"','id="fernando-title-3"',1).replace('class="fernando-section"','class="fernando-section fernando-section-third"',1)
          s = s[:a] + one + '\n' + two + '\n' + three + s[b:]
          css = '''
.bbg-elementor .fernando-section + .fernando-section{padding-top:0}
.bbg-elementor .fernando-section-alt{color:#111;background:#fff}
.bbg-elementor .fernando-section-alt .fernando-shell{background:#f0eee8;color:#111;grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr)}
.bbg-elementor .fernando-section-alt .fernando-portrait{grid-column:2;grid-row:1}
.bbg-elementor .fernando-section-alt .fernando-content{grid-column:1;grid-row:1}
.bbg-elementor .fernando-section-alt .fernando-content .prime-label{color:#777}
.bbg-elementor .fernando-section-alt .fernando-content h2{color:#111}
.bbg-elementor .fernando-section-alt .fernando-role{color:#AE9C6E}
.bbg-elementor .fernando-section-alt .fernando-summary p{color:#555}
.bbg-elementor .fernando-section-alt .fernando-milestones{border-top-color:#1113}
.bbg-elementor .fernando-section-alt .fernando-milestones>div{border-right-color:#1113}
.bbg-elementor .fernando-section-alt .fernando-milestones dt{color:#111}
.bbg-elementor .fernando-section-alt .fernando-milestones dd{color:#666}
.bbg-elementor .fernando-section-alt .fernando-link{color:#111;border-bottom-color:#1118}
@media(max-width:1000px){.bbg-elementor .fernando-section-alt .fernando-shell{grid-template-columns:1fr}.bbg-elementor .fernando-section-alt .fernando-portrait{grid-column:1;grid-row:1}.bbg-elementor .fernando-section-alt .fernando-content{grid-column:1;grid-row:2}}
'''
          marker = '</style>\n<div class="bbg-elementor">'
          if marker not in s:
              raise SystemExit('Style marker not found')
          s = s.replace(marker, css + '\n</style>\n<div class="bbg-elementor">', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit restored sections
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          git commit -m 'Restore three Fernando sections with alternating colors'
          git push
