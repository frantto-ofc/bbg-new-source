name: Maintain BBG production layout
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  maintain-site:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply BBG production adjustments
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          if 'fernando-sections-no-gap' not in s:
              css = '''\n<style id="fernando-sections-no-gap">\n.bbg-elementor .fernando-section{padding-top:0!important;padding-bottom:0!important;}\n</style>\n'''
              s = s.replace('</head>', css + '</head>', 1)

          if 'bbg-footer-contact-icons' not in s:
              footer_css = '''\n<style id="bbg-footer-contact-icons">\n.bbg-elementor .footer-contact-link{display:inline-flex!important;align-items:center;gap:9px}\n.bbg-elementor .footer-contact-link svg{width:15px;height:15px;flex:0 0 15px;color:#AE9C6E;stroke:currentColor}\n</style>\n'''
              s = s.replace('</head>', footer_css + '</head>', 1)

          instagram = '<a class="footer-contact-link" href="https://www.instagram.com/bbgdevelopments/" target="_blank" rel="noopener noreferrer" aria-label="Abrir o Instagram da BBG em uma nova guia"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="5" stroke-width="1.7"/><circle cx="12" cy="12" r="4" stroke-width="1.7"/><circle cx="17.4" cy="6.7" r="1" fill="currentColor" stroke="none"/></svg>Instagram</a>'
          whatsapp = '<a class="footer-contact-link" href="https://wa.me/14073715499" target="_blank" rel="noreferrer" aria-label="Conversar com a BBG pelo WhatsApp"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20.5 11.7a8.5 8.5 0 0 1-12.6 7.45L3.5 20.5l1.4-4.25A8.5 8.5 0 1 1 20.5 11.7Z" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M8.2 7.8c.2-.45.42-.46.72-.47h.6c.2 0 .38.08.48.35l.73 1.77c.08.22.05.4-.08.58l-.55.7c-.13.16-.14.32-.04.5.53.96 1.3 1.72 2.24 2.26.2.11.36.1.5-.06l.75-.86c.16-.19.37-.23.58-.14l1.82.86c.22.1.34.27.34.49 0 .49-.22 1.17-.59 1.54-.47.47-1.17.7-1.86.7-1.03 0-2.35-.46-3.75-1.64-1.76-1.49-2.85-3.43-2.85-4.87 0-.72.25-1.28.5-1.71Z" fill="currentColor" stroke="none"/></svg>WhatsApp</a>'
          email = '<a class="footer-contact-link" href="mailto:public.bbg.group@gmail.com" aria-label="Enviar e-mail para a BBG"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="5.5" width="18" height="13" rx="1.5" stroke-width="1.7"/><path d="m4 7 8 6 8-6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>E-mail</a>'

          contact = re.compile(r'(<span>Contato</span>\s*<a href="#contato">Peça orçamento</a>)(.*?)(</div>)', re.S)
          m = contact.search(s)
          if m:
              replacement = m.group(1) + '\n' + instagram + '\n' + whatsapp + '\n' + email + '\n' + m.group(3)
              s = s[:m.start()] + replacement + s[m.end():]

          s = re.sub(r'(<h2 id="fernando-title-2">).*?(</h2>)', r'\1Diogo\2', s, count=1, flags=re.S)
          s = re.sub(r'(<h2 id="fernando-title-3">).*?(</h2>)', r'\1Carlos\2', s, count=1, flags=re.S)
          s = re.sub(r'\n?<script id="bbg-leadership-name-fix">.*?</script>\n?', '\n', s, flags=re.S)

          if 'id="noticia-financiamento"' not in s:
              s = s.replace('<article class="prime-article prime-article-image">', '<article class="prime-article prime-article-image" id="noticia-financiamento">', 1)
          if '<a class="secondary-hero-card" href="#noticia-financiamento"' not in s:
              s = s.replace('<article class="secondary-hero-card">', '<a class="secondary-hero-card" href="#noticia-financiamento" aria-label="Ir para a notícia sobre financiamento">', 1)
              s = s.replace('</article>\n  </div>\n</section>\n<section class="product-overview', '</a>\n  </div>\n</section>\n<section class="product-overview', 1)

          s = s.replace('class="secondary-hero-button secondary-hero-button-primary" href="#contato"', 'class="secondary-hero-button secondary-hero-button-primary button button-primary" href="#contato"', 1)
          s = s.replace('Ver modelos <span aria-hidden="true">⟶</span>', 'Ver modelos <span class="arrow-glyph" aria-hidden="true">↗︎</span>', 1)

          def add_model_link(match):
              block = match.group(0)
              if 'model-card-link' in block:
                  return block
              name_m = re.search(r'data-model-name="([^"]+)"', block)
              name = name_m.group(1) if name_m else 'Modelo BBG'
              open_end = block.find('>') + 1
              overlay = f'\n<a class="model-card-link" href="#" aria-label="Abrir {name}"></a>'
              return block[:open_end] + overlay + block[open_end:]

          s = re.sub(r'<article class="feature-row model-row".*?</article>', add_model_link, s, flags=re.S)

          carousel_css = '''\n<style id="bbg-model-carousel-updates">\n.bbg-elementor .feature-grid{display:flex!important;gap:18px!important;overflow-x:hidden!important;overflow-y:hidden!important;border-top:0!important;border-bottom:0!important;padding:8px 0 18px!important;scrollbar-width:none;position:relative;cursor:grab;touch-action:pan-y;user-select:none}\n.bbg-elementor .feature-grid.is-dragging{cursor:grabbing}\n.bbg-elementor .feature-grid::-webkit-scrollbar{display:none}\n.bbg-elementor .feature-row.model-row{flex:0 0 clamp(280px,31vw,390px)!important;display:flex!important;flex-direction:column!important;grid-template-columns:none!important;min-height:620px!important;padding:0!important;border:1px solid #3d3d49!important;border-radius:12px!important;background:#1e1e2a!important;overflow:hidden!important;position:relative!important}\n.bbg-elementor .feature-row.model-row>span{position:absolute!important;z-index:4!important;top:18px!important;left:18px!important;color:#fff!important;background:transparent!important;border:0!important;border-radius:0!important;padding:0!important;font-size:11px!important;backdrop-filter:none!important;box-shadow:none!important}\n.bbg-elementor .feature-row.model-row>div{display:flex!important;flex-direction:column!important;flex:0 0 auto!important}\n.bbg-elementor .feature-row.model-row small{order:2!important;padding:18px 22px 0!important;color:#858592!important}\n.bbg-elementor .feature-row.model-row h3{order:3!important;max-width:none!important;margin:8px 22px 0!important;color:#AE9C6E!important;font-size:28px!important;line-height:1.06!important}\n.bbg-elementor .feature-row.model-row .model-mobile-image{order:1!important;width:100%!important;aspect-ratio:4/3!important;margin:0!important;border-radius:0!important;overflow:hidden!important}\n.bbg-elementor .feature-row.model-row .model-mobile-image img{width:100%!important;height:100%!important;object-fit:cover!important;border-radius:0!important;pointer-events:none}\n.bbg-elementor .feature-row.model-row>p{grid-column:auto!important;grid-row:auto!important;margin:20px 22px 26px!important;padding:0!important;color:#c3c3cc!important;font-size:13px!important;line-height:1.6!important;display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden}\n.bbg-elementor .model-card-link{position:absolute;z-index:5;inset:0;display:block!important;cursor:inherit}\n.bbg-elementor .secondary-hero-card{cursor:pointer}\n.bbg-elementor .secondary-hero-button .arrow-glyph{transition:transform .45s cubic-bezier(.22,1,.36,1)}\n@media(hover:hover){.bbg-elementor .secondary-hero-button-outline:hover .arrow-glyph{transform:rotate(45deg)}}\n@media(max-width:680px){.bbg-elementor .feature-row.model-row{flex-basis:82vw!important;min-height:570px!important}.bbg-elementor .feature-row.model-row>p{-webkit-line-clamp:6}}\n</style>\n'''
          if 'id="bbg-model-carousel-updates"' in s:
              s = re.sub(r'<style id="bbg-model-carousel-updates">.*?</style>', carousel_css.strip(), s, count=1, flags=re.S)
          else:
              s = s.replace('</head>', carousel_css + '</head>', 1)

          carousel_js = '''\n<script id="bbg-model-carousel-script">\n(() => {\n  const start = () => {\n    const rail = document.querySelector('.bbg-elementor #modelos.feature-grid');\n    if (!rail || rail.dataset.loopReady === '1') return;\n    const originals = [...rail.querySelectorAll(':scope > .model-row')].slice(0, 4);\n    if (originals.length !== 4) return;\n    rail.dataset.loopReady = '1';\n    [...rail.children].slice(4).forEach(card => card.remove());\n    for (let set = 0; set < 2; set++) originals.forEach(card => {\n      const clone = card.cloneNode(true);\n      clone.dataset.marqueeClone = 'true';\n      clone.setAttribute('aria-hidden', 'true');\n      clone.removeAttribute('id');\n      clone.querySelectorAll('[id]').forEach(el => el.removeAttribute('id'));\n      clone.querySelectorAll('a,button,[tabindex]').forEach(el => el.tabIndex = -1);\n      rail.appendChild(clone);\n    });\n    let position = 0, loopWidth = 0, hovered = false, focused = false;\n    let pointer = null, lastX = 0, distance = 0, dragged = false;\n    let last = performance.now();\n    const wrap = value => loopWidth ? ((value % loopWidth) + loopWidth) % loopWidth : 0;\n    const render = () => {\n      position = wrap(position);\n      rail.scrollLeft = position;\n    };\n    const measure = () => {\n      const previous = loopWidth;\n      loopWidth = rail.children[4].offsetLeft - rail.children[0].offsetLeft;\n      if (previous > 0) position = position / previous * loopWidth;\n      render();\n    };\n    measure();\n    // Keep fractional progress outside scrollLeft: browsers may round scroll offsets.\n    const tick = now => {\n      const elapsed = Math.min(50, now - last);\n      last = now;\n      if (!hovered && !focused && pointer === null && !document.hidden) {\n        position += 26 * elapsed / 1000;\n        render();\n      }\n      requestAnimationFrame(tick);\n    };\n    rail.addEventListener('pointerenter', event => {\n      if (event.pointerType === 'mouse') hovered = true;\n    });\n    rail.addEventListener('pointerleave', event => {\n      if (event.pointerType === 'mouse') hovered = false;\n    });\n    rail.addEventListener('focusin', () => { focused = true; });\n    rail.addEventListener('focusout', event => { focused = rail.contains(event.relatedTarget); });\n    rail.addEventListener('dragstart', event => event.preventDefault());\n    rail.addEventListener('pointerdown', event => {\n      if (pointer !== null || (event.pointerType === 'mouse' && event.button !== 0)) return;\n      pointer = event.pointerId;\n      lastX = event.clientX;\n      distance = 0;\n      dragged = false;\n      rail.classList.add('is-dragging');\n      rail.setPointerCapture(event.pointerId);\n    });\n    rail.addEventListener('pointermove', event => {\n      if (pointer !== event.pointerId) return;\n      const delta = lastX - event.clientX;\n      lastX = event.clientX;\n      distance += Math.abs(delta);\n      dragged = distance > 4;\n      position += delta;\n      render();\n      if (event.cancelable) event.preventDefault();\n    });\n    const finish = event => {\n      if (pointer !== event.pointerId) return;\n      pointer = null;\n      rail.classList.remove('is-dragging');\n      if (rail.hasPointerCapture(event.pointerId)) rail.releasePointerCapture(event.pointerId);\n      if (event.pointerType === 'mouse') {\n        const bounds = rail.getBoundingClientRect();\n        hovered = event.clientX >= bounds.left && event.clientX <= bounds.right &&\n          event.clientY >= bounds.top && event.clientY <= bounds.bottom;\n      }\n    };\n    rail.addEventListener('pointerup', finish);\n    rail.addEventListener('pointercancel', finish);\n    rail.addEventListener('lostpointercapture', finish);\n    rail.addEventListener('click', event => {\n      if (dragged || event.target.closest('.model-card-link')) {\n        event.preventDefault();\n        event.stopPropagation();\n      }\n      dragged = false;\n    }, true);\n    new ResizeObserver(measure).observe(rail);\n    requestAnimationFrame(tick);\n  };\n  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start, {once:true});\n  else start();\n})();\n</script>\n'''
          if 'id="bbg-model-carousel-script"' in s:
              s = re.sub(r'<script id="bbg-model-carousel-script">.*?</script>', carousel_js.strip(), s, count=1, flags=re.S)
          else:
              s = s.replace('</body>', carousel_js + '</body>', 1)

          p.write_text(s, encoding='utf-8')
      - name: Commit production adjustments
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Improve four-model carousel interaction"
          git push