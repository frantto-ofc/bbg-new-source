name: Update leadership names and footer icons
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-leadership-footer.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update index
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          def rename_section(html, section_id, name):
              pat = re.compile(r'(<section\s+class="[^"]*fernando-section[^"]*"\s+id="' + re.escape(section_id) + r'".*?</section>)', re.S)
              m = pat.search(html)
              if not m:
                  raise SystemExit(f'Section {section_id} not found')
              sec = m.group(1)
              sec = re.sub(r'(<h2\s+id="[^"]+">)(.*?)(</h2>)', rf'\1{name}\3', sec, count=1, flags=re.S)
              sec = re.sub(r'<figcaption>.*?</figcaption>', f'<figcaption>{name} · BBG Developments</figcaption>', sec, count=1, flags=re.S)
              sec = re.sub(r'alt="[^"]*"', f'alt="{name}, liderança da BBG Developments"', sec, count=1)
              sec = re.sub(r'aria-label="Marcos profissionais de [^"]+"', f'aria-label="Marcos profissionais de {name}"', sec, count=1)
              return html[:m.start()] + sec + html[m.end():]

          s = rename_section(s, 'fernando-2', 'Diogo')
          s = rename_section(s, 'fernando-3', 'Carlos')

          css = '''
<style id="bbg-footer-contact-icons">
.bbg-elementor .footer-contact-link{display:inline-flex!important;align-items:center;gap:9px}
.bbg-elementor .footer-contact-link svg{width:15px;height:15px;flex:0 0 15px;color:#AE9C6E;stroke:currentColor}
</style>
'''
          if 'id="bbg-footer-contact-icons"' not in s:
              s = s.replace('</head>', css + '</head>', 1)

          instagram = '<a class="footer-contact-link" href="https://www.instagram.com/bbgdevelopments/" target="_blank" rel="noopener noreferrer" aria-label="Abrir o Instagram da BBG em uma nova guia"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="5" stroke-width="1.7"/><circle cx="12" cy="12" r="4" stroke-width="1.7"/><circle cx="17.4" cy="6.7" r="1" fill="currentColor" stroke="none"/></svg>Instagram</a>'
          whatsapp = '<a class="footer-contact-link" href="https://wa.me/14073715499" target="_blank" rel="noreferrer" aria-label="Conversar com a BBG pelo WhatsApp"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20.5 11.7a8.5 8.5 0 0 1-12.6 7.45L3.5 20.5l1.4-4.25A8.5 8.5 0 1 1 20.5 11.7Z" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M8.2 7.8c.2-.45.42-.46.72-.47h.6c.2 0 .38.08.48.35l.73 1.77c.08.22.05.4-.08.58l-.55.7c-.13.16-.14.32-.04.5.53.96 1.3 1.72 2.24 2.26.2.11.36.1.5-.06l.75-.86c.16-.19.37-.23.58-.14l1.82.86c.22.1.34.27.34.49 0 .49-.22 1.17-.59 1.54-.47.47-1.17.7-1.86.7-1.03 0-2.35-.46-3.75-1.64-1.76-1.49-2.85-3.43-2.85-4.87 0-.72.25-1.28.5-1.71Z" fill="currentColor" stroke="none"/></svg>WhatsApp</a>'
          email = '<a class="footer-contact-link" href="mailto:public.bbg.group@gmail.com" aria-label="Enviar e-mail para a BBG"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="5.5" width="18" height="13" rx="1.5" stroke-width="1.7"/><path d="m4 7 8 6 8-6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>E-mail</a>'

          contact_pat = re.compile(r'(<span>Contato</span>\s*<a href="#contato">Peça orçamento</a>)(.*?)(</div>)', re.S)
          m = contact_pat.search(s)
          if not m:
              raise SystemExit('Footer contact block not found')
          links = '\n' + instagram + '\n' + whatsapp + '\n' + email + '\n'
          s = s[:m.start()] + m.group(1) + links + m.group(3) + s[m.end():]

          p.write_text(s, encoding='utf-8')

          Path('.github/workflows/update-leadership-footer.yml').unlink(missing_ok=True)
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/update-leadership-footer.yml
          git commit -m "Update leadership names and footer icons"
          git push